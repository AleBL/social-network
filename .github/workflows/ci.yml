name: CI

on:
  pull_request:
  # Runs on master too: Render only auto-deploys a commit after its checks pass.
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: social-network-backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Uses the Yarn version pinned in package.json ("packageManager").
      - run: corepack enable

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test

  backend-integration:
    name: Backend (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        # Throwaway database: the tests delete all data between cases.
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/integration-test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p integration-test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 30s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: integration-test-password
    defaults:
      run:
        working-directory: social-network-backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - run: yarn install --frozen-lockfile
      - run: yarn test:integration

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: social-network-frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build
