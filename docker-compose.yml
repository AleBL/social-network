services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  social-network-backend:
    build:
      context: ./social-network-backend
    container_name: social-network-backend
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - ./social-network-backend:/app
      # Keeps the node_modules installed in the image from being hidden by the bind mount
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      # Container-to-container traffic always uses Neo4j's internal port 7687;
      # NEO4J_BOLT_PORT is only the port published on the host.
      NEO4J_URI: bolt://neo4j:7687
    env_file: 
      - .env
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - app-network
    command: ["yarn", "dev"]
    restart: unless-stopped

  social-network-frontend:
    build:
      context: ./social-network-frontend
    container_name: social-network-frontend
    ports:
      - "${FRONTEND_PORT}:8080"
    volumes:
      - ./social-network-frontend:/app
      # Keeps the node_modules installed in the image from being hidden by the bind mount
      - /app/node_modules
    depends_on:
      social-network-backend:
        condition: service_started
    networks:
      - app-network
    command: ["yarn", "start"]
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  neo4j-data:
