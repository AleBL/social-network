# Render Blueprint: https://render.com/docs/blueprint-spec
# Database: Neo4j AuraDB (not hosted on Render).
# Secrets (sync: false) are requested only once, when the Blueprint is created.
services:
  - type: web
    name: social-network-backend
    runtime: node
    plan: free
    rootDir: social-network-backend
    buildCommand: yarn install --frozen-lockfile
    startCommand: node src/app.js
    healthCheckPath: /ping
    # Deploy only after the GitHub Actions checks of the commit pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false

  - type: web
    name: social-network-frontend
    runtime: static
    # Builds from the repo root so staticPublishPath is unambiguous.
    buildCommand: cd social-network-frontend && yarn install --frozen-lockfile && yarn build
    staticPublishPath: ./social-network-frontend/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - social-network-frontend/**
    routes:
      # Vue Router uses HTML5 history mode: serve index.html for every route.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # @vue/cli 5 dependencies do not install on Node 24+.
      - key: NODE_VERSION
        value: "22.12.0"
